name: Apartment Monitor

on:
  schedule:
    - cron: '17 7,19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apartment-monitor
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collectors
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          APIFY_API_KEY: ${{ secrets.APIFY_APIKEY }}
        run: python main.py collect

      - name: Process and score listings
        run: python main.py process

      - name: Generate static site
        run: python main.py generate

      - name: Send notifications
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python main.py notify

      - name: Commit updated data
        run: |
          git config user.name "apartment-bot"
          git config user.email "bot@apartment-hunt.local"
          git add data/
          git diff --staged --quiet || git commit -m "Update listings $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
